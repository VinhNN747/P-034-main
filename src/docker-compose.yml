services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-backend.txt
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../.env
    environment:
      AI_BACKEND_URL: http://backend-ai:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env for both backends}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-ai:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-ai.txt
    # Download the task classifier from Hugging Face into ./data first (no-op without GATEWAY_TASK_CLASSIFIER_SOURCE_URL).
    command: ["sh", "-c", "python -m src.scripts.fetch_task_classifier && exec uvicorn src.backend_ai.main:app --host 0.0.0.0 --port 8001"]
    stop_grace_period: 45s
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - ../.env
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env for both backends}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start downloads and loads the ~1 GB classifier.
      start_period: 300s

  comparison-worker:
    profiles: ["standalone-comparison"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-ai.txt
    command: ["python", "-m", "src.backend_ai.workers.comparison_worker"]
    env_file:
      - ../.env
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env for both backends}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
    volumes:
      - ../data:/app/data
    depends_on:
      backend-ai:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: nginx:stable-alpine
    profiles: ["proxy"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      backend-ai:
        condition: service_healthy
    restart: unless-stopped
