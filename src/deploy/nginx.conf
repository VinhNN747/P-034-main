# Optional public API edge; backend names match docker-compose.yml.
events {}

http {
    upstream management {
        server backend:8000;
    }
    upstream ai {
        server backend-ai:8001;
    }
    map $request_method $request_service {
        default management;
        POST ai;
    }

    server {
        listen 8080;
        client_max_body_size 256k;
        proxy_read_timeout 610s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Internal service credentials must never be usable through the edge.
        location /internal/ {
            return 404;
        }
        location = /api/v1/gateway/requests {
            proxy_pass http://$request_service;
        }
        location = /api/v1/gateway/requests/ {
            proxy_pass http://$request_service;
        }
        location ~ ^/api/v1/(chat|status|gateway/analyze)/?$ {
            proxy_pass http://ai;
        }
        location /api/v1/runtime/ {
            proxy_pass http://ai;
        }
        # OpenAI-compatible API and Files API. Inline base64 images need a larger
        # body than the 256k runtime API; prefer /v1/files + file_id for big files.
        location = /v1/files {
            client_max_body_size 52m;
            error_page 413 = @openai_body_error;
            proxy_pass http://ai;
        }
        location @openai_body_error {
            default_type application/json;
            add_header x-request-id $request_id always;
            add_header x-gateway-request-id $request_id always;
            add_header x-should-retry false always;
            return 413 '{"error":{"message":"Request body exceeds endpoint limit.","type":"invalid_request_error","param":null,"code":"request_too_large"}}';
        }
        location = /v1/files/ {
            client_max_body_size 52m;
            error_page 413 = @openai_body_error;
            proxy_pass http://ai;
        }
        location = /v1/embeddings {
            client_max_body_size 8m;
            error_page 413 = @openai_body_error;
            proxy_pass http://ai;
        }
        location /v1/ {
            client_max_body_size 32m;
            error_page 413 = @openai_body_error;
            proxy_buffering off;
            proxy_pass http://ai;
        }
        location / {
            proxy_pass http://management;
        }
    }
}
