# Builds the classifier image on Cloud Build (the model is downloaded from Hugging Face inside
# Google's network, not uploaded from your machine) and pushes it to Artifact Registry.
#   gcloud builds submit . --config src/classifier_service/cloudbuild.yaml \
#     --ignore-file src/classifier_service/.gcloudignore \
#     --substitutions _MODEL_URL=https://huggingface.co/<user>/<repo>/resolve/<commit>
# Needs the Secret Manager secret "hf-read-token" (a read-only HF token) readable by the Cloud Build
# service account. Deploy the pushed image with the gcloud run deploy command in docs.
substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: ai20k
  _IMAGE: task-classifier
  _MODEL_URL: ""
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: ["DOCKER_BUILDKIT=1"]
    secretEnv: ["HF_TOKEN"]
    args:
      - -c
      - |
        printf '%s' "$$HF_TOKEN" > /workspace/hf_token
        docker build -f src/classifier_service/Dockerfile \
          --secret id=hf_token,src=/workspace/hf_token \
          --build-arg MODEL_URL="${_MODEL_URL}" \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest .
        status=$$?
        rm -f /workspace/hf_token
        exit $$status
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/hf-read-token/versions/latest
      env: HF_TOKEN
options:
  machineType: E2_HIGHCPU_8
